# Included only by dashboard.example.com. Authentication is inherited from that server.
location = / {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /dashboard-offline.html;
}

location ^~ /api/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
}

location = /healthz {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8083;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

location = /index.html { return 302 /; }
location = /dashboard-offline.html {
    internal;
    root /www/wwwroot/dashboard.example.com;
    add_header Cache-Control "no-store" always;
}

location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /www/wwwroot/dashboard.example.com;
    try_files $uri =404;
}

location / { return 404; }
