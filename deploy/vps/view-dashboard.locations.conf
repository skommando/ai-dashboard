# Include in the dedicated TLS server block. The application authenticates viewing.
# The ACME challenge is served by the existing site for certificate renewal.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root @SITE_ROOT@;
    try_files $uri =404;
}

location = /dashboard-offline.html {
    internal;
    root @SITE_ROOT@;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
}

location ^~ / {
    auth_basic off;
    proxy_pass http://127.0.0.1:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /dashboard-offline.html;
}
