<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f3">
  <title>进度簿 · 暂时离线</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:32px 24px;min-height:100vh;display:grid;place-items:center;background:#f5f6f3;color:#202b27;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    main{max-width:410px}small{font-size:12px;letter-spacing:.08em;color:#537565}
    h1{font-size:28px;line-height:1.4;margin:24px 0 14px;font-weight:600}
    p{color:#69756f;font-size:14px;line-height:1.9}
    a{display:inline-flex;align-items:center;justify-content:center;margin-top:15px;padding:13px 20px;background:#537565;color:#fff;text-decoration:none;border-radius:7px}
    a:focus-visible{outline:3px solid #986124;outline-offset:3px}
    .line{width:42px;height:3px;background:#b4772e;margin-top:27px}
  </style>
</head>
<body><main><small>进度簿 / 项目进度</small><div class="line"></div>
  <h1>服务暂时无法连接</h1>
  <p>进度服务正在恢复。连接恢复后即可继续查看最新进度。</p>
  <p>这不代表项目任务失败。</p><a href="/">重新连接</a>
</main></body>
</html>
